name: Build Docker and Push to GHCR

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]

# Выделяем права на запись в пакеты репозитория
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Настройка сборщика Docker Buildx (активирует кеширование)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизация в GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHDR_TEST }} # GITHUB_TOKEN

      # # Приведение имени репозитория к нижнему регистру (требование GHCR)
      # - name: Downcase repository name
      #   run: |
      #     echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/apache-alpine" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      # Сборка и автоматическая отправка образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            www_test:latest
            www_test:${{ github.sha }} 
          cache-from: type=gha
          cache-to: type=gha,mode=max
