name: Build and Push to ECR

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create .env file from bulk secret
        run: echo "${{ secrets.DEV_ENV_FILE }}" > .env

      - name: Build, tag, and push images to ECR
        env:
          REGISTRY: ${{ secrets.ECR }} # ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          APP1: ${{ secrets.APP1 }}
          APP2: ${{ secrets.APP2 }}
        run: |
          docker compose build
          docker images
          ls -la
          pwd

          # Тегирование и пуш $APP1
          docker tag backend:$TAG $REGISTRY/$APP1:$TAG
          docker tag backend:latest $REGISTRY/$APP1:latest
          docker push $REGISTRY/$APP1 --all-tags

          # Тегирование и пуш $APP2
          docker tag frontend:$TAG $REGISTRY/$APP2:$TAG
          docker tag frontend:latest $REGISTRY/$APP2:latest
          docker push $REGISTRY/$APP2 --all-tags


